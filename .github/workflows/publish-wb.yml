name: Publish WB mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: write

concurrency:
  group: wb-pages-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hosting shell
        uses: actions/checkout@v4

      - name: Fetch current WB frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://zdbzli7g3x4hbc3xxrh5ngne3s.app.sitebin.io'
          rm -rf site
          mkdir -p site/icons site/assets

          files=(
            index.html
            styles.css
            responsive.css
            app.js
            ios-install.js
            theme-toggle.js
            logo-theme.js
            mantle-adapter.js
            range-label-fix.js
            team-key-bootstrap.js
            config.js
            team-config.json
            players.txt
            manifest.webmanifest
            sw.js
          )

          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location --retry 3 \
              "$BASE/$file" -o "site/$file"
          done

          for file in icon.svg icon-192.png icon-512.png; do
            curl --fail --silent --show-error --location --retry 3 \
              "$BASE/icons/$file" -o "site/icons/$file"
          done

          curl --fail --silent --show-error --location --retry 3 \
            "$BASE/assets/team-logo.png" -o site/assets/team-logo.png || true

          printf '%s\n' 'wb.rweb.site' > site/CNAME
          touch site/.nojekyll

          test -s site/index.html
          test -s site/app.js
          test -s site/config.js
          test -s site/sw.js

      - name: Publish gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: publish WB mirror'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
